<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 爬取运营台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script>
  /* 防闪烁：在解析 CSS 前同步设定主题，避免浅色闪一下再变深 */
  (function () {
    try {
      var t = localStorage.getItem("dashboard-theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<style>
  :root {
    /* 精密工业风 / Precision Industrial — azure 沉静蓝主色 + 冷调墨蓝中性 */
    /* 中性色阶（偏冷墨蓝） */
    --ink-50:  oklch(0.985 0.003 255);
    --ink-100: oklch(0.965 0.006 255);
    --ink-150: oklch(0.945 0.008 255);
    --ink-200: oklch(0.905 0.010 255);
    --ink-300: oklch(0.845 0.012 255);
    --ink-400: oklch(0.700 0.018 260);
    --ink-500: oklch(0.560 0.022 262);
    --ink-800: oklch(0.265 0.018 262);
    /* 主色 azure */
    --azure:        oklch(0.58 0.150 252);
    --azure-strong: oklch(0.52 0.165 252);
    --azure-soft:   oklch(0.955 0.030 252);
    /* 语义状态色 */
    --run:    oklch(0.60 0.130 240); --run-s:  oklch(0.95 0.040 240);
    --wait:   oklch(0.74 0.135 72);  --wait-s: oklch(0.96 0.055 72);
    --done:   oklch(0.66 0.140 152); --done-s: oklch(0.95 0.045 152);
    --fail:   oklch(0.60 0.200 22);  --fail-s: oklch(0.95 0.045 22);

    --bg: var(--ink-50);
    --surface: #ffffff;
    --surface-2: var(--ink-100);
    --surface-3: var(--ink-150);
    --sidebar-bg: #ffffff;
    --topbar-bg: var(--surface);
    --border: var(--ink-200);
    --border-strong: var(--ink-300);
    --text-primary: var(--ink-800);
    --text-secondary: var(--ink-500);
    --text-tertiary: var(--ink-400);
    --accent: var(--azure);
    --accent-soft: var(--azure-soft);
    --accent-text: var(--azure-strong);
    --success: var(--done); --success-soft: var(--done-s); --success-text: oklch(0.50 0.130 152);
    --warning: var(--wait); --warning-soft: var(--wait-s); --warning-text: oklch(0.62 0.130 72);
    --danger: var(--fail); --danger-soft: var(--fail-s); --danger-text: oklch(0.52 0.190 22);
    --info: var(--run); --info-soft: var(--run-s); --info-text: oklch(0.50 0.130 240);
    --shadow-sm: 0 1px 2px oklch(0.2 0.02 262 / .06), 0 1px 3px oklch(0.2 0.02 262 / .05);
    --shadow-md: 0 4px 12px oklch(0.2 0.02 262 / .08), 0 2px 4px oklch(0.2 0.02 262 / .05);
    --radius: 12px; --radius-sm: 8px; --radius-lg: 18px;
    --font: "IBM Plex Sans", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-head: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
    --sidebar-w: 248px;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: oklch(0.175 0.012 262);
    --surface: oklch(0.215 0.014 262);
    --surface-2: oklch(0.255 0.015 262);
    --surface-3: oklch(0.295 0.016 262);
    --sidebar-bg: oklch(0.215 0.014 262);
    --topbar-bg: var(--surface);
    --border: oklch(0.33 0.014 262);
    --border-strong: oklch(0.40 0.014 262);
    --text-primary: oklch(0.94 0.006 262);
    --text-secondary: oklch(0.72 0.012 262);
    --text-tertiary: oklch(0.55 0.012 262);
    --accent: oklch(0.72 0.140 252);
    --accent-soft: oklch(0.30 0.050 252);
    --accent-text: oklch(0.78 0.130 252);
    --success: oklch(0.66 0.140 152); --success-soft: oklch(0.30 0.050 152); --success-text: oklch(0.80 0.130 152);
    --warning: oklch(0.78 0.135 72);  --warning-soft: oklch(0.30 0.060 72);  --warning-text: oklch(0.85 0.120 72);
    --danger: oklch(0.70 0.200 22);  --danger-soft: oklch(0.32 0.060 22);  --danger-text: oklch(0.82 0.190 22);
    --info: oklch(0.70 0.130 240);   --info-soft: oklch(0.30 0.050 240);   --info-text: oklch(0.80 0.120 240);
    --shadow-sm: 0 1px 2px oklch(0 0 0 / .3);
    --shadow-md: 0 4px 14px oklch(0 0 0 / .4);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text-primary);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  a { color: var(--accent-text); }
  ::selection { background: var(--accent-soft); }

  /* 精密工业风：标题/数字用 Space Grotesk（展示感），正文用 IBM Plex Sans（可读性） */
  .brand-text strong, .topbar-title h1, .kpi .num, .section-title,
  .bc-brand-name, .bc-pf-name, .bc-pf-section-name, .bc-num,
  .col-head, .tab-pill { font-family: var(--font-head); letter-spacing: -0.01em; }

  /* ---------------- 布局骨架 ---------------- */
  .app-shell { display: flex; min-height: 100vh; min-height: 100dvh; }

  /* ---------------- 侧边导航 ---------------- */
  .sidebar {
    width: var(--sidebar-w);
    flex: 0 0 var(--sidebar-w);
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand {
    display: flex; align-items: center; gap: 11px;
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--border);
  }
  .brand-logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--info));
    color: #fff; font-weight: 700; font-size: 14px;
    display: grid; place-items: center;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
  .brand-text strong { font-size: 15px; font-weight: 600; }
  .brand-text span { font-size: 10.5px; color: var(--text-tertiary); letter-spacing: .3px; }

  .nav { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 12px; border: none; border-radius: var(--radius-sm);
    background: transparent; color: var(--text-secondary);
    font-size: 13.5px; text-align: left; width: 100%;
    position: relative; transition: background .15s, color .15s;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text-primary); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; border-radius: var(--radius-sm); }
  .nav-item.active::before {
    content: ""; position: absolute; left: 0; top: 8px; bottom: 8px;
    width: 3px; border-radius: 3px; background: var(--accent);
  }
  .nav-ico { width: 18px; height: 18px; display: grid; place-items: center; color: inherit; flex: 0 0 18px; }
  .nav-ico svg { width: 18px; height: 18px; }
  .nav-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-badge {
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 11px; font-weight: 600;
    display: grid; place-items: center; font-variant-numeric: tabular-nums;
  }
  .nav-item:not(.active) .nav-badge { background: var(--border-strong); color: var(--text-secondary); }
  /* 操纵台：导航顶部常驻项，加分隔线以区别于下方业务功能 */
  .nav-console { margin-bottom: 6px; }
  .nav-console::after {
    content: ""; position: absolute; left: 12px; right: 12px; bottom: -3px;
    height: 1px; background: var(--border); opacity: .6;
  }
  .nav-console.active::before { background: var(--accent); }

  .sidebar-foot { padding: 12px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .sidebar-foot .conn { font-size: 12px; color: var(--text-tertiary); display: flex; align-items: center; gap: 6px; }

  /* ---------------- 主区 ---------------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 12px 22px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .topbar-title { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  .topbar-title h1 { font-size: 17px; font-weight: 600; margin: 0; white-space: nowrap; }
  .conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-tertiary); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-tertiary); }
  .dot.ok { background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }
  .dot.bad { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
  .topbar-actions { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .updated { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; }
  select, .btn, .icon-btn {
    font-size: 13px; border: 1px solid var(--border-strong);
    background: var(--surface); color: var(--text-primary);
    border-radius: var(--radius-sm); padding: 7px 12px;
  }
  select { cursor: pointer; }
  .btn { cursor: pointer; transition: background .15s, border-color .15s; font-weight: 500; }
  .btn:hover { border-color: var(--accent); color: var(--accent-text); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.06); color: #fff; }
  .icon-btn {
    width: 38px; height: 36px; padding: 0; display: grid; place-items: center;
    cursor: pointer; transition: background .15s;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn svg { width: 18px; height: 18px; color: var(--text-secondary); }
  .icon-sun { display: none; }
  [data-theme="dark"] .icon-moon { display: none; }
  [data-theme="dark"] .icon-sun { display: block; }

  .content { padding: 20px 22px 40px; }

  /* ---------------- 通知铃铛 + 下拉面板 ---------------- */
  .notif-wrap { position: relative; flex: 0 0 auto; }
  .notif-bell {
    position: relative; width: 38px; height: 36px; padding: 0;
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text-secondary);
    display: grid; place-items: center; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .notif-bell:hover { border-color: var(--accent); color: var(--accent-text); }
  .bell-ico { width: 18px; height: 18px; display: grid; place-items: center; color: inherit; }
  .bell-ico svg { width: 18px; height: 18px; }
  .notif-badge {
    position: absolute; top: -5px; right: -6px;
    min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 9px; background: var(--danger); color: #fff;
    font-size: 11px; font-weight: 700; line-height: 18px;
    text-align: center; font-variant-numeric: tabular-nums;
    box-shadow: 0 2px 6px rgba(198,40,40,.35);
    animation: notifPop .3s ease;
  }
  @keyframes notifPop {
    0% { transform: scale(0); } 55% { transform: scale(1.2); } 100% { transform: scale(1); }
  }

  /* 下拉面板 */
  .notif-panel {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 40;
    width: 380px; max-height: 420px;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--radius); box-shadow: var(--shadow-md);
    overflow: hidden; display: flex; flex-direction: column;
    animation: panelIn .18s ease;
  }
  @keyframes panelIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .notif-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    font-size: 14px; font-weight: 600; color: var(--text-primary);
  }
  .notif-total { font-weight: 400; font-size: 12px; color: var(--text-tertiary); }
  .notif-body { overflow-y: auto; padding: 6px 0; flex: 1; }
  .notif-group-label {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 16px 4px; font-size: 11.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .notif-group-label.red { color: var(--danger-text); }
  .notif-group-label.amber { color: var(--warning-text); }
  .notif-group-label.info { color: var(--info-text); }
  .notif-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 9px 16px; font-size: 13px; line-height: 1.45;
    color: var(--text-secondary); transition: background .12s;
    cursor: default;
  }
  .notif-item:hover { background: var(--surface-2); }
  .notif-item.red { color: var(--danger-text); }
  .notif-item.amber { color: var(--warning-text); }
  .notif-item.info { color: var(--info-text); }
  .notif-item .alert-ico { width: 16px; height: 16px; flex: 0 0 16px; margin-top: 1px; }
  .notif-empty { text-align: center; color: var(--text-tertiary); padding: 28px 16px; font-size: 13px; }

  /* ---------------- 告警（保留给断连等关键提示） ---------------- */
  .alerts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .alert {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: var(--radius-sm);
    font-size: 13px; border: 1px solid var(--border);
  }
  .alert .alert-ico { width: 18px; height: 18px; flex: 0 0 18px; }
  .alert.ok { background: var(--success-soft); border-color: transparent; color: var(--success-text); }
  .alert.info { background: var(--info-soft); border-color: transparent; color: var(--info-text); }
  .alert.amber { background: var(--warning-soft); border-color: transparent; color: var(--warning-text); }
  .alert.red { background: var(--danger-soft); border-color: transparent; color: var(--danger-text); }

  /* ---------------- KPI ---------------- */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow-sm);
  }
  .kpi .label { font-size: 12.5px; color: var(--text-tertiary); }
  .kpi .num { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 4px; }

  .section-title { font-size: 14px; font-weight: 600; margin: 22px 0 12px; color: var(--text-primary); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .section-title .st-ico { width: 18px; height: 18px; display: grid; place-items: center; color: var(--accent); flex: 0 0 18px; }
  .section-title .st-ico svg { width: 18px; height: 18px; }
  .section-title .st-sub { font-weight: 400; font-size: 12.5px; color: var(--text-tertiary); }
  .section-group { margin-bottom: 28px; }
  .section-group:first-child .section-title { margin-top: 4px; }

  /* 操纵台：功能开关页面 */
  .console-sub { font-size: 13px; color: var(--text-tertiary); margin: -4px 0 18px; line-height: 1.6; }
  .console-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .console-card {
    display: flex; align-items: center; gap: 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: border-color .18s, box-shadow .18s, transform .12s, background .18s;
  }
  .console-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .console-card.off { opacity: .62; background: var(--surface-2); }
  .console-card.off:hover { opacity: .85; }
  .cc-ico {
    width: 44px; height: 44px; flex: 0 0 44px; border-radius: 12px;
    display: grid; place-items: center; color: #fff;
    background: var(--accent);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.12);
  }
  .console-card.off .cc-ico { background: var(--border-strong); color: var(--text-secondary); }
  .cc-ico svg { width: 22px; height: 22px; }
  .cc-body { flex: 1; min-width: 0; }
  .cc-name { font-family: var(--font-head); font-size: 15px; font-weight: 600; color: var(--text-primary); }
  .cc-desc { font-size: 12.5px; color: var(--text-tertiary); margin-top: 3px; }
  /* iOS 风切换开关 */
  .cc-switch {
    flex: 0 0 auto; width: 46px; height: 27px; border-radius: 14px;
    background: var(--border-strong); position: relative;
    transition: background .22s cubic-bezier(.4, 0, .2, 1);
  }
  .cc-switch.on { background: var(--accent); }
  .cc-knob {
    position: absolute; top: 3px; left: 3px; width: 21px; height: 21px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25);
    transition: transform .22s cubic-bezier(.34, 1.56, .64, 1);
  }
  .cc-switch.on .cc-knob { transform: translateX(19px); }
  [data-theme="dark"] .cc-knob { background: var(--ink-100); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm);
  }
  .card h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pf-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 9px; }
  .stat-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
  .stat-row .k { color: var(--text-secondary); }
  .stat-row .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .pill-row { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }

  /* ---------------- 看板 Tab 分栏 ---------------- */
  .tab-bar { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab-pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 15px; border-radius: 999px; font-size: 13px; font-weight: 500;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-secondary); cursor: pointer; transition: all .15s;
  }
  .tab-pill:hover { border-color: var(--accent); }
  .tab-pill .pdot { width: 8px; height: 8px; border-radius: 50%; }
  .tab-pill .tab-cnt {
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
    font-size: 11.5px; font-weight: 600; display: grid; place-items: center;
    font-variant-numeric: tabular-nums; background: var(--border); color: var(--text-secondary);
  }
  /* Tab 激活态 & 颜色变体 */
  .tab-pill.active.running { background: var(--info-soft); color: var(--info-text); border-color: transparent; }
  .tab-pill.active.running .pdot { background: var(--info); }
  .tab-pill.active.running .tab-cnt { background: var(--info); color: #fff; }
  .tab-pill.active.pending { background: var(--warning-soft); color: var(--warning-text); border-color: transparent; }
  .tab-pill.active.pending .pdot { background: var(--warning); }
  .tab-pill.active.pending .tab-cnt { background: var(--warning); color: #fff; }
  .tab-pill.active.done { background: var(--success-soft); color: var(--success-text); border-color: transparent; }
  .tab-pill.active.done .pdot { background: var(--success); }
  .tab-pill.active.done .tab-cnt { background: var(--success); color: #fff; }
  .tab-pill.active.failed { background: var(--danger-soft); color: var(--danger-text); border-color: transparent; }
  .tab-pill.active.failed .pdot { background: var(--danger); }
  .tab-pill.active.failed .tab-cnt { background: var(--danger); color: #fff; }

  /* 未激活的 pill 保持淡色点 */
  .tab-pill:not(.active) .pdot { background: var(--border-strong); }

  /* ---------------- 品牌卡片（新视觉设计） ---------------- */
  /* 主列表容器：2 列网格，让 5 个品牌不被压扁 */
  .grouped-list { display: flex; flex-direction: column; gap: 16px; align-items: stretch; }

  .brand-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow-sm);
    overflow: hidden; transition: box-shadow .2s, transform .2s, border-color .2s;
  }
  .brand-card:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); }

  /* 品牌头部：56px monogram + 品牌信息 + 大数字尾 */
  .bc-head {
    display: grid; grid-template-columns: 52px 1fr auto;
    gap: 16px; align-items: center;
    padding: 16px 20px; cursor: pointer; user-select: none;
    transition: background .15s;
  }
  .bc-head:hover { background: var(--surface-2); }
